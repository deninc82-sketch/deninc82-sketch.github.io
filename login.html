<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід на сайт</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            height: 100vh;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-container {
            background-color: #f9f9f9;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: #e60202;
        }

        .modal-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #e60202;
            outline: none;
        }

        .form-group-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .form-group-checkbox input {
            margin-right: 10px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .form-group-checkbox label {
            color: #333;
            cursor: pointer;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-submit {
            background-color: #333;
            color: white;
        }

        .btn-submit:hover {
            background-color: #e60202;
        }

        .btn-cancel {
            background-color: transparent;
            color: #333;
            border: 2px solid #333;
        }

        .btn-cancel:hover {
            background-color: #777;
            color: white;
            border-color: #777;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-container">
            <button type="button" class="close-modal-btn" id="closeModalBtn">&times;</button>
            
            <h2>Вхід на сайт</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="login-email">Логін або Електронна адреса</label>
                    <input type="text" id="login-email" name="login-email" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Запам'ятати мене</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Увійти</button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn">Відмінити</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        'use strict';

        document.addEventListener('DOMContentLoaded', () => {
            const isAuthorized = false;

            if (isAuthorized) {
                console.log('Користувач вже авторизований.');
                const modal = document.querySelector('#loginModal');
                if (modal) {
                    modal.style.display = 'none';
                }
            } else {
                console.log('Користувач не авторизований. Відображається модальне вікно входу.');
            }

            const modal = document.querySelector('#loginModal');
            const closeModalBtn = document.querySelector('#closeModalBtn');
            const cancelBtn = document.querySelector('#cancelBtn');

            const hideModal = () => {
                if (modal) {
                    modal.style.display = 'none';
                }
            };

            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', hideModal);
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', hideModal);
            }
        });
    </script>
</body>
</html>
