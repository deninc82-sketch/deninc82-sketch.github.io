<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <nav>
        <ul>
            <!-- Тепер посилання ведуть на реальні сторінки проєкту -->
            <li><a href="index.html">Головна</a></li>
            <li><a href="register.html">Реєстрація</a></li>
        </ul>
    </nav>

    <main>
        <div class="form-container">
            <h2>Реєстрація на сайті</h2>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="last-name">Прізвище</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>

                <div class="form-group">
                    <label for="first-name">Ім'я</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>

                <div class="form-group">
                    <label for="email">Електронна адреса</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Підтвердження пароля</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" name="phone" placeholder="+380" required>
                </div>

                <!-- Виправлена структура радіо-кнопок статі -->
                <div class="form-group-gender">
                    <span class="gender-label">Стать:</span>
                    <input type="radio" id="gender-female" name="gender" value="female" required>
                    <label for="gender-female" class="radio-label">Жінка</label>

                    <input type="radio" id="gender-male" name="gender" value="male">
                    <label for="gender-male" class="radio-label">Чоловік</label>
                </div>

                <button type="submit" class="submit-btn">Зареєструватися</button>
                <a href="index.html" class="guest-btn">Зайти без реєстрації</a>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Усі права захищені.</p>
    </footer>

</body>
</html>
