<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture 18 - Classes</title>
</head>
<body>
  <h1>JavaScript Classes: Calculator</h1>

  <script>
    'use strict';

    class Calculator {
      constructor() {
        this.result = 0;
      }

      add(a, b) {
        if (b === undefined) {
          this.result = this.result + a;
        } else {
          this.result = a + b;
        }
        return this.result;
      }

      subtract(a, b) {
        if (b === undefined) {
          this.result = this.result - a;
        } else {
          this.result = a - b;
        }
        return this.result;
      }

      multiply(a, b) {
        if (b === undefined) {
          this.result = this.result * a;
        } else {
          this.result = a * b;
        }
        return this.result;
      }

      divide(a, b) {
        if (b === undefined) {
          if (a === 0) {
            console.error("Ділення на нуль неможливе!");
            return this.result;
          }
          this.result = this.result / a;
        } else {
          if (b === 0) {
            console.error("Ділення на нуль неможливе!");
            return this.result;
          }
          this.result = a / b;
        }
        return this.result;
      }

      displayResult() {
        console.log(this.result);
      }
    }

    const calc = new Calculator();

    calc.add(5, 10);
    calc.displayResult();

    calc.multiply(3);
    calc.displayResult();

    calc.subtract(5);
    calc.displayResult();

    calc.divide(8);
    calc.displayResult();
  </script>
</body>
</html>
